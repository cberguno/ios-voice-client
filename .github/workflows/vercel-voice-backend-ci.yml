name: Vercel Voice Backend CI
on:
  push:
    branches: [vercel-voice-backend]
  pull_request:
    paths:
      - "vercel-voice-api/**"
      - ".github/workflows/vercel-voice-backend-ci.yml"
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vercel-voice-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify mocked voice route
        run: npm test
      - name: Build Next.js function
        run: npm run build
