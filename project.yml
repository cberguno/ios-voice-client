# XcodeGen project spec — direct OpenRouter client (no voice server)
name: ios-voice-client
options:
  bundleIdPrefix: com.cberguno
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  VoiceClient:
    type: application
    platform: iOS
    sources:
      - VoiceRecorder.swift
      - NativeTranscriber.swift
      - OpenRouterKeychain.swift
      - OpenRouterClient.swift
      - VoiceView.swift
      - VoiceApp.swift
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: This app needs microphone access to record your voice for conversations.
        NSSpeechRecognitionUsageDescription: This app needs speech recognition to transcribe your voice.
